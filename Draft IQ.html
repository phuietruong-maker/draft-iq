  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap');
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #26303f; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #34415a; }
  button { transition: transform .15s ease, filter .15s ease, box-shadow .2s ease, background-color .15s ease; }
  button:not(:disabled) { cursor: pointer; }
  button:not(:disabled):hover { filter: brightness(1.12); transform: translateY(-1px); }
  button:not(:disabled):active { filter: brightness(0.94); transform: translateY(0); }
  button:disabled { cursor: not-allowed; }
  input, textarea { transition: box-shadow .15s ease, border-color .15s ease; }
  input:focus, textarea:focus, select:focus { outline: none; box-shadow: 0 0 0 3px rgba(57,255,136,0.18); }
  a { transition: opacity .15s ease; }
  a:hover { opacity: 0.8; }
  .diq-card { box-shadow: 0 4px 24px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.35); }
  .diq-row { transition: background-color .15s ease, box-shadow .15s ease, transform .15s ease; }
  .diq-row:hover { background-color: #161f2e !important; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
  .diq-hover-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,0.4); }
  .diq-quickpick:focus-within { box-shadow: 0 0 0 4px rgba(255,210,63,0.16); }
  .diq-pulse { animation: diqPulse 2.2s ease-in-out infinite; }
  @keyframes diqPulse {
    0%, 100% { box-shadow: 0 4px 24px rgba(57,255,136,0.22); }
    50% { box-shadow: 0 4px 34px rgba(57,255,136,0.45); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

essee's lead back once healthy."},{id:"nbc-20260817-0915-najee-harris",players:["Najee Harris"],source:"NBC Sports",ts:17869833e5,text:"Free agent recovering from a torn Achilles is visiting the Giants; would likely work behind Cam Skattebo and Tyrone Tracy if signed."},{id:"nbc-20260817-0915-nate-wiggins",players:["Nate Wiggins"],source:"NBC Sports",ts:17869833e5,text:"Returned to practice Monday after missing the preseason opener; expected to be good to go moving forward."},{id:"nbc-20260817-0815-breece-hall",players:["Breece Hall"],source:"NBC Sports",ts:17869797e5,text:"HC Aaron Glenn said Hall's Monday practice injury doesn't look serious, but he'll be evaluated. Braelon Allen would step into lead-back duties if Hall misses time."},{id:"nbc-20260817-0715-mansoor-delane",players:["Mansoor Delane"],source:"NBC Sports",ts:17869761e5,text:"Practiced in full pads for the first time in camp, indicating his rookie-season shoulder injury is behind him and he's on track for Week 1."},{id:"nbc-20260817-0715-breece-hall",players:["Breece Hall"],source:"NBC Sports",ts:17869761e5,text:"Left Monday's practice with trainers after going down untouched on a catch; injury cause unclear pending further reports."},{id:"nbc-20260817-0715-chris-bell",players:["Chris Bell"],source:"NBC Sports",ts:17869761e5,text:"Activated from the NFI list as he continues recovering from a torn ACL; a rookie whose path to playing time is uncertain given Miami's receiver depth."},{id:"nbc-20260816-1906-alec-pierce",players:["Alec Pierce"],source:"NBC Sports",ts:178693236e4,text:"Not expected to resume practicing this week, which would wipe out the rest of the Colts' camp for him \u2014 a risky fantasy asset given the tight runway to Week 1."},{id:"nbc-20260816-1843-adoree-jackson",players:["Adoree' Jackson"],source:"NBC Sports",ts:178693098e4,text:"ESPN names him a free-agent option the Cowboys have explored, helped by a prior relationship with Dallas' new DC from their time together in Philadelphia. revised the outlook worse."},{id:"nbc-20260816-1531-noah-brown",players:["Noah Brown"],source:"NBC Sports",ts:178691946e4,text:"Signed by the Raiders after an injury-plagued 2025; likely a rotational depth piece behind a thin Las Vegas receiver room."},{id:"nbc-20260816-1521-rico-dowdle",players:["Rico Dowdle"],source:"NBC Sports",ts:178691886e4,text:"FOX Sports projects him as the Steelers' backfield workhorse in a run-heavy scheme, though Jaylen Warren could still carve out passing-down work."},{id:"nbc-20260816-1452-ozzy-trapilo",players:["Ozzy Trapilo"],source:"NBC Sports",ts:178691712e4,text:"Activated from PUP and already back at practice after last season's patellar tendon rupture \u2014 an encouraging recovery timeline for the Bears' left tackle competition."},{id:"nbc-20260816-1425-christian-mccaffrey",players:["Christian McCaffrey"],source:"NBC Sports",ts:17869155e5,text:"Did not practice Sunday with the same tightness issue; team isn't detailing specifics but there's no real concern about Week 1 readiness."},{id:"nbc-20260816-1408-kyle-monangai",players:["Kyle Monangai"],source:"NBC Sports",ts:178691448e4,text:"Left Sunday's practice early after getting tangled up with a defender; walked off under his own power, an early positive sign before the more serious diagnosis came later."},{id:"nbc-20260816-1352-george-kittle",players:["George Kittle"],source:"NBC Sports",ts:178691352e4,text:"Says he's nearing a return to practice from his Achilles injury and feels he has a chance to play Week 1 in Australia against the Rams."},{id:"nbc-20260816-1331-tucker-kraft",players:["Tucker Kraft"],source:"NBC Sports",ts:178691226e4,text:"Expects to play on a snap count for roughly the first half of the season as he eases back from a torn ACL, though he's on track for Week 1."},{id:"nbc-20260816-1314-jeremiyah-love",players:["Jeremiyah Love"],source:"NBC Sports",ts:178691124e4,text:"Team remains hopeful for a Week 1 return from his ankle injury; increasingly described as the presumptive lead back once healthy."},{id:"nbc-20260816-1256-deshaun-watson",players:["Deshaun Watson"],source:"NBC Sports",ts:178691016e4,text:"ESPN says a starter could be named soon after the second preseason game; recent reports suggest Watson has the edge over Shedeur Sanders."},{id:"nbc-20260816-1237-dominic-richardson",players:["Dominic Richardson"],source:"NBC Sports",ts:178690902e4,text:"Signed by the Titans as an undrafted free agent after being let go by the Cowboys."},{id:"nbc-20260816-1225-tank-dell",players:["Tank Dell"],source:"NBC Sports",ts:17869083e5,text:"Sat out Sunday's practice without an injury designation, likely a scheduled rest day as he continues working back from a 2024 multi-ligament knee injury."},{id:"nbc-20260816-1214-jaylin-noel",players:["Jaylin Noel"],source:"NBC Sports",ts:178690764e4,text:"Missed Sunday's practice with the hamstring/finger combo that would go on to sideline him for weeks."},{id:"nbc-20260816-1130-quinn-ewers",players:["Quinn Ewers"],source:"NBC Sports",ts:1786905e6,text:"Suffered a groin injury in Friday's preseason game; Miami signed Mark Gronowski for depth behind him as the primary backup."},{id:"nbc-20260816-1042-jeremy-mcnichols",players:["Jeremy McNichols"],source:"NBC Sports",ts:178690212e4,text:"Expected to be sidelined a few weeks with a quad injury \u2014 a tough spot given he was already no better than fourth on Washington's RB depth chart."},{id:"nbc-20260816-0955-isaiah-likely",players:["Isaiah Likely"],source:"NBC Sports",ts:17868993e5,text:"Leading all Giants first-team receivers in catches with Malik Nabers still working back from his ACL tear; ESPN argues he belongs closer to a top-10 tight end than his current ADP."},{id:"nbc-20260816-0946-malik-benson",players:["Malik Benson"],source:"NBC Sports",ts:178689876e4,text:"ESPN names him the Raiders' top training-camp performer and a threat to leapfrog Jack Bech for the third receiver job."},{id:"nbc-20260816-0922-lukas-van-ness",players:["Lukas V
